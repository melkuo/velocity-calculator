<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velocity Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text-muted: #6b6b66;
    --text-faint: #a0a09a;
    --teal-bg: #e1f5ee;
    --teal-border: #9fe1cb;
    --teal-dark: #085041;
    --teal-mid: #0f6e56;
    --teal-light: #1d9e75;
    --danger-bg: #fcebeb;
    --danger-border: #f09595;
    --danger-text: #791f1f;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem 3rem;
  }

  .app { width: 100%; max-width: 400px; }

  .app-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .app-icon {
    width: 40px; height: 40px;
    border-radius: var(--radius-sm);
    background: var(--teal-bg);
    border: 1px solid var(--teal-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .app-title { font-size: 17px; font-weight: 500; color: var(--text); }
  .app-sub { font-size: 12px; color: var(--text-faint); margin-top: 1px; }

  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    margin-bottom: 10px;
  }
  .section-head {
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 12px;
  }
  .section-icon { font-size: 14px; }
  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .time-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: center;
    gap: 6px;
  }
  .colon {
    font-size: 20px;
    font-weight: 500;
    color: var(--text-faint);
    text-align: center;
    padding-bottom: 16px;
    user-select: none;
  }
  .time-field { display: flex; flex-direction: column; gap: 5px; }
  .time-field input {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    width: 100%;
  }
  .field-hint {
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
  }

  .dist-row { display: flex; align-items: center; gap: 10px; }
  .dist-row input { flex: 1; font-family: 'DM Mono', monospace; font-size: 16px; }
  .dist-unit {
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
  }

  input[type=number] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 10px;
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number]:hover { border-color: var(--border-strong); }
  input[type=number]:focus { border-color: var(--teal-light); box-shadow: 0 0 0 3px rgba(29,158,117,0.12); }
  input[type=number]::placeholder { color: var(--text-faint); }

  .result-card {
    background: var(--teal-bg);
    border: 1px solid var(--teal-border);
    border-radius: var(--radius);
    padding: 1.4rem 1.1rem 1.1rem;
    text-align: center;
    margin-top: 4px;
    animation: fadeUp 0.25s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .result-top {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-bottom: 6px;
  }
  .result-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--teal-light);
  }
  .result-lbl {
    font-size: 11px; font-weight: 500;
    color: var(--teal-mid);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .result-num {
    font-family: 'DM Mono', monospace;
    font-size: 52px;
    font-weight: 500;
    color: var(--teal-dark);
    line-height: 1;
    letter-spacing: -1px;
  }
  .result-unit { font-size: 14px; color: var(--teal-mid); margin-top: 5px; }

  .stats-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-top: 12px;
  }
  .stat {
    background: rgba(255,255,255,0.55);
    border-radius: var(--radius-sm);
    border: 1px solid rgba(159,225,203,0.5);
    padding: 8px 10px;
    text-align: center;
  }
  .stat-val {
    font-family: 'DM Mono', monospace;
    font-size: 15px; font-weight: 500;
    color: var(--teal-dark);
  }
  .stat-lbl { font-size: 11px; color: var(--teal-mid); margin-top: 2px; }

  .empty-card {
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 1.5rem;
    text-align: center;
    margin-top: 4px;
  }
  .empty-icon { font-size: 26px; display: block; margin-bottom: 6px; }
  .empty-card p { font-size: 13px; color: var(--text-faint); }

  .error-banner {
    display: flex; align-items: center; gap: 8px;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-top: 4px;
    animation: fadeUp 0.2s ease;
  }
  .error-icon { font-size: 16px; flex-shrink: 0; }
  .error-banner span { font-size: 13px; color: var(--danger-text); }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #232320;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.18);
      --text: #eeeee8;
      --text-muted: #9a9a94;
      --text-faint: #666660;
      --teal-bg: #0b2a21;
      --teal-border: #0f5040;
      --teal-dark: #9fe1cb;
      --teal-mid: #5dcaa5;
      --teal-light: #1d9e75;
      --danger-bg: #2a1010;
      --danger-border: #7a2020;
      --danger-text: #f09595;
    }
    .stat { background: rgba(0,0,0,0.2); }
  }
</style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <div class="app-icon">&#9654;</div>
    <div>
      <div class="app-title">Velocity calculator</div>
      <div class="app-sub">Average speed from time &amp; distance</div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-head">
      <span class="section-icon">🕐</span>
      <span class="section-label">Start time</span>
    </div>
    <div class="time-row">
      <div class="time-field">
        <input type="number" inputmode="numeric" id="sh" min="0" max="23" placeholder="00" />
        <span class="field-hint">hr</span>
      </div>
      <span class="colon">:</span>
      <div class="time-field">
        <input type="number" inputmode="numeric" id="sm" min="0" max="59" placeholder="00" />
        <span class="field-hint">min</span>
      </div>
      <span class="colon">:</span>
      <div class="time-field">
        <input type="number" inputmode="numeric" id="ss" min="0" max="59" placeholder="00" />
        <span class="field-hint">sec</span>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-head">
      <span class="section-icon">🕑</span>
      <span class="section-label">End time</span>
    </div>
    <div class="time-row">
      <div class="time-field">
        <input type="number" inputmode="numeric" id="eh" min="0" max="47" placeholder="00" />
        <span class="field-hint">hr</span>
      </div>
      <span class="colon">:</span>
      <div class="time-field">
        <input type="number" inputmode="numeric" id="em" min="0" max="59" placeholder="00" />
        <span class="field-hint">min</span>
      </div>
      <span class="colon">:</span>
      <div class="time-field">
        <input type="number" inputmode="numeric" id="es" min="0" max="59" placeholder="00" />
        <span class="field-hint">sec</span>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-head">
      <span class="section-icon">📍</span>
      <span class="section-label">Distance</span>
    </div>
    <div class="dist-row">
      <input type="number" inputmode="numeric" id="dist" min="0" step="any" placeholder="0.0" />
      <span class="dist-unit">km</span>
    </div>
  </div>

  <div id="output">
    <div class="empty-card">
      <span class="empty-icon">⚡</span>
      <p>Fill in the fields above to calculate</p>
    </div>
  </div>

</div>
<script>
  const timeOrder = ['sh','sm','ss','eh','em','es'];

  timeOrder.forEach((id, i) => {
    const el = document.getElementById(id);
    el.addEventListener('input', function() {
      calc();
      if (this.value.length >= 2) {
        const next = timeOrder[i + 1];
        if (next) {
          const nextEl = document.getElementById(next);
          nextEl.focus();
          nextEl.select();
        }
      }
    });
  });

  document.getElementById('dist').addEventListener('input', calc);

  function v(id) { const n = parseFloat(document.getElementById(id).value); return isNaN(n) ? null : n; }

  function calc() {
    const sh=v('sh'),sm=v('sm'),ss=v('ss');
    const eh=v('eh'),em=v('em'),es=v('es');
    const dist=v('dist');
    const out = document.getElementById('output');
    const anyStart = sh!==null||sm!==null||ss!==null;
    const anyEnd   = eh!==null||em!==null||es!==null;

    if (!anyStart || !anyEnd || dist===null) {
      out.innerHTML = '<div class="empty-card"><span class="empty-icon">⚡</span><p>Fill in the fields above to calculate</p></div>';
      return;
    }

    const startS = (sh||0)*3600+(sm||0)*60+(ss||0);
    const endS   = (eh||0)*3600+(em||0)*60+(es||0);
    const dur = endS - startS;

    if (dur <= 0) {
      out.innerHTML = '<div class="error-banner"><span class="error-icon">⚠️</span><span>End time must be after start time.</span></div>';
      return;
    }
    if (dist <= 0) {
      out.innerHTML = '<div class="error-banner"><span class="error-icon">⚠️</span><span>Distance must be greater than zero.</span></div>';
      return;
    }

    const kmh = dist / (dur / 3600);
    const mpm = dist / (dur / 60);
    const minPerKm = dur / 60 / dist;
    const minPart = Math.floor(minPerKm);
    const secPart = Math.round((minPerKm - minPart) * 60);

    out.innerHTML = `
      <div class="result-card">
        <div class="result-top"><div class="result-dot"></div><span class="result-lbl">Average speed</span></div>
        <div class="result-num">${kmh.toFixed(2)}</div>
        <div class="result-unit">kilometres per hour</div>
        <div class="stats-row">
          <div class="stat">
            <div class="stat-val">${mpm.toFixed(3)}</div>
            <div class="stat-lbl">km / min</div>
          </div>
          <div class="stat">
            <div class="stat-val">${minPart}:${String(secPart).padStart(2,'0')}</div>
            <div class="stat-lbl">min / km pace</div>
          </div>
        </div>
      </div>`;
  }
</script>
</body>
</html>
